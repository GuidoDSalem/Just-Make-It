[package]
name = "jmi-cli"
description = "Just Make It: línea de comandos (plantillas, vista previa, render y lotes)"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "jmi"
path = "src/main.rs"

[dependencies]
jmi-core = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
clap = { version = "4", features = ["derive"] }
csv = "1"
